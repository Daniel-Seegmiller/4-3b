<html>
<body>

<script>
function calc(){
let PV = document.getElementById("num1").value;
let n = document.getElementById("num2").value;
let r = document.getElementById("num3").value;
let P = ((r/100/12) * PV) / (1-(1+(r/100/12))**-(n*12));
document.getElementById("ans").innerHTML = P;
document.getElementById("ans").innerHTML = "If your loan is $" + PV + " and your loan period is " + n + " years at " + r + "%, your monthly payment will be $" + P.toFixed(2);
}

</script>


<p id="p1">
<input id = "num1">
What amount are you borrowing?
<br>
<input id = "num2">
What is the loan period in years?
<br>
<input id = "num3">
% Annual interest rate


  

  <br>
<button onclick="calc()"> Calculate your loan payment! </button>
  <br>

</p>

<p id="ans">
</p>



</body>
</html>
