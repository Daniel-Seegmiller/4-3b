<body>

<script>
function add(){
let PV = document.getElementById("num1").value;
let n = document.getElementById("num2").value;
let r = document.getElementById("num3").value;
let P = ((r/100/12) * PV) / (1-(1+(r/100/12))**-(n*12));
document.getElementById("ans").innerHTML = P;
}

</script>


<p id="p1">
What amount are you borrowing?
<input id = "num1">
<br>
What is the loan period?
<input id = "num2">
<br>
% Annual interest rate
<input id = "num3">

  

  <br>
<button onclick="add()"> Calculate your loan payment! </button>
  <br>

</p>

<p>
  Your result is <span id="ans">_____________</span>
  
</p>
